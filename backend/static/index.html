<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello</title>
  </head>
  <body>
    <h1>Hello world</h1>
    <p id="api">Calling API...</p>
    <script>
      fetch("/api/hello")
        .then((r) => r.json())
        .then((d) => (document.getElementById("api").textContent = d.message));
    </script>
  </body>
</html>
